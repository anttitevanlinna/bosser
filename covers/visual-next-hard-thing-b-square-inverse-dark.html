<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Next Hard Thing — B square inverse dark</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 1200px;
    background: #0a0a0a;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
  }
  .stage { position: relative; width: 1200px; height: 1200px;
    background: radial-gradient(circle 700px at 50% 50%, #121212 0%, #0a0a0a 75%);
  }
</style>
</head>
<body>
<div class="stage">
<svg id="viz" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <marker id="arrowG" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 L4,6 Z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <!-- everything gets pulled into the average -->
  <circle cx="150" cy="300" r="9" fill="#8a8a8a" opacity="0.75"/>
  <line x1="150" y1="300" x2="448" y2="468" stroke="#8a8a8a" stroke-width="5" opacity="0.75" marker-end="url(#arrowG)"/>
  <circle cx="640" cy="128" r="9" fill="#8a8a8a" opacity="0.63"/>
  <line x1="640" y1="128" x2="616" y2="345" stroke="#8a8a8a" stroke-width="5" opacity="0.63" marker-end="url(#arrowG)"/>
  <circle cx="1052" cy="288" r="9" fill="#8a8a8a" opacity="0.51"/>
  <line x1="1052" y1="288" x2="742" y2="462" stroke="#8a8a8a" stroke-width="5" opacity="0.51" marker-end="url(#arrowG)"/>
  <circle cx="1092" cy="652" r="9" fill="#8a8a8a" opacity="0.75"/>
  <line x1="1092" y1="652" x2="812" y2="588" stroke="#8a8a8a" stroke-width="5" opacity="0.75" marker-end="url(#arrowG)"/>
  <circle cx="1040" cy="980" r="9" fill="#8a8a8a" opacity="0.63"/>
  <line x1="1040" y1="980" x2="765" y2="738" stroke="#8a8a8a" stroke-width="5" opacity="0.63" marker-end="url(#arrowG)"/>
  <circle cx="188" cy="852" r="9" fill="#8a8a8a" opacity="0.51"/>
  <line x1="188" y1="852" x2="448" y2="682" stroke="#8a8a8a" stroke-width="5" opacity="0.51" marker-end="url(#arrowG)"/>

  <!-- cluster of plausible answers, injected by script -->
  <g id="cluster"></g>

  <text x="600" y="802" text-anchor="middle" fill="#666666" font-size="24" font-weight="500" letter-spacing="5">THE AVERAGE</text>
  <text x="600" y="840" text-anchor="middle" fill="#666666" font-size="24" font-weight="500" letter-spacing="5">EVERYTHING PLAUSIBLE</text>
</svg>

<script>
  function mulberry32(a) {
    return function() {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rand = mulberry32(42);
  const g = document.getElementById('cluster');
  const cx = 600, cy = 560;
  for (let i = 0; i < 170; i++) {
    const gx = (rand() + rand() + rand() + rand() - 2) / 2;
    const gy = (rand() + rand() + rand() + rand() - 2) / 2;
    const x = cx + gx * 200;
    const y = cy + gy * 190;
    const d = Math.hypot(x - cx, y - cy);
    const r = 2 + rand() * 4;
    const opacity = Math.max(0.12, 0.85 - d / 230);
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    el.setAttribute('cx', x.toFixed(1));
    el.setAttribute('cy', y.toFixed(1));
    el.setAttribute('r', r.toFixed(1));
    el.setAttribute('fill', '#9a9a9a');
    el.setAttribute('opacity', opacity.toFixed(2));
    g.appendChild(el);
  }
  const core = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  core.setAttribute('cx', cx); core.setAttribute('cy', cy);
  core.setAttribute('r', 16); core.setAttribute('fill', '#c0c0c0');
  g.appendChild(core);
</script>
</div>
</body>
</html>
