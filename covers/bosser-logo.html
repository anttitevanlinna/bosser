<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bosser Logo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 1000px;
            height: 1000px;
            background: #000000;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .logo-row {
            display: flex;
            gap: 0;
        }

        .letter {
            width: 200px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 180px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <div class="logo-row">
            <div class="letter">B</div>
            <div class="letter">O</div>
            <div class="letter">S</div>
        </div>
        <div class="logo-row">
            <div class="letter">S</div>
            <div class="letter">E</div>
            <div class="letter">R</div>
        </div>
    </div>
</body>
</html>
