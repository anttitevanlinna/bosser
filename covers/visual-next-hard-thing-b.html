<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Next Hard Thing — Visual B</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px;
    background: #0a0a0a;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
  }
  .stage { position: relative; width: 1920px; height: 1080px;
    background: radial-gradient(ellipse 1100px 650px at 50% 50%, #121212 0%, #0a0a0a 70%);
  }
</style>
</head>
<body>
<div class="stage">
<svg id="viz" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <marker id="arrowO" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 L4,6 Z" fill="#ff6b35"/>
    </marker>
    <marker id="arrowT" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 L4,6 Z" fill="#4ecdc4"/>
    </marker>
    <marker id="arrowV" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 L4,6 Z" fill="#a78bfa"/>
    </marker>
  </defs>

  <!-- cluster of plausible answers, injected by script -->
  <g id="cluster"></g>

  <text x="960" y="700" text-anchor="middle" fill="#666666" font-size="28" font-weight="500" letter-spacing="6">THE AVERAGE — EVERYTHING PLAUSIBLE</text>

  <!-- distinctiveness: left -->
  <line x1="850" y1="510" x2="360" y2="380" stroke="#ff6b35" stroke-width="6" marker-end="url(#arrowO)"/>
  <circle cx="330" cy="372" r="12" fill="#ff6b35"/>
  <circle cx="330" cy="372" r="24" fill="none" stroke="#ff6b35" stroke-width="2" opacity="0.4"/>
  <text x="330" y="310" text-anchor="middle" fill="#ff6b35" font-size="40" font-weight="700" letter-spacing="6">DISTINCTIVENESS</text>

  <!-- creativity: up-right -->
  <line x1="1040" y1="470" x2="1490" y2="240" stroke="#a78bfa" stroke-width="6" marker-end="url(#arrowV)"/>
  <circle cx="1520" cy="225" r="12" fill="#a78bfa"/>
  <circle cx="1520" cy="225" r="24" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.4"/>
  <text x="1520" y="165" text-anchor="middle" fill="#a78bfa" font-size="40" font-weight="700" letter-spacing="6">CREATIVITY</text>

  <!-- precision: down-right -->
  <line x1="1030" y1="590" x2="1450" y2="830" stroke="#4ecdc4" stroke-width="6" marker-end="url(#arrowT)"/>
  <circle cx="1480" cy="847" r="12" fill="#4ecdc4"/>
  <circle cx="1480" cy="847" r="24" fill="none" stroke="#4ecdc4" stroke-width="2" opacity="0.4"/>
  <text x="1480" y="925" text-anchor="middle" fill="#4ecdc4" font-size="40" font-weight="700" letter-spacing="6">PRECISION</text>
</svg>

<script>
  // deterministic PRNG so every render is identical
  function mulberry32(a) {
    return function() {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rand = mulberry32(42);
  const g = document.getElementById('cluster');
  const cx = 960, cy = 540;
  for (let i = 0; i < 170; i++) {
    // gaussian-ish via sum of uniforms
    const gx = (rand() + rand() + rand() + rand() - 2) / 2;
    const gy = (rand() + rand() + rand() + rand() - 2) / 2;
    const x = cx + gx * 260;
    const y = cy + gy * 200;
    const d = Math.hypot((x - cx) / 1.3, y - cy);
    const r = 2 + rand() * 4;
    const opacity = Math.max(0.12, 0.85 - d / 260);
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', x.toFixed(1));
    c.setAttribute('cy', y.toFixed(1));
    c.setAttribute('r', r.toFixed(1));
    c.setAttribute('fill', '#9a9a9a');
    c.setAttribute('opacity', opacity.toFixed(2));
    g.appendChild(c);
  }
  // dense core
  const core = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  core.setAttribute('cx', cx); core.setAttribute('cy', cy);
  core.setAttribute('r', 18); core.setAttribute('fill', '#c0c0c0');
  g.appendChild(core);
</script>
</div>
</body>
</html>
