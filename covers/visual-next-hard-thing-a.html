<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Next Hard Thing — Visual A</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px;
    background: #0a0a0a;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
  }
  .stage { position: relative; width: 1920px; height: 1080px;
    background: radial-gradient(ellipse 1200px 700px at 50% 50%, #141414 0%, #0a0a0a 70%);
  }
  svg { position: absolute; inset: 0; }
</style>
</head>
<body>
<div class="stage">
<svg width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 L4,6 Z" fill="#ff6b35"/>
    </marker>
    <radialGradient id="avgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#888888" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#888888" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- gravity rings of the average -->
  <circle cx="960" cy="540" r="120" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="6 10"/>
  <circle cx="960" cy="540" r="210" fill="none" stroke="#262626" stroke-width="1.5" stroke-dasharray="6 14"/>
  <circle cx="960" cy="540" r="310" fill="none" stroke="#1d1d1d" stroke-width="1.5" stroke-dasharray="6 18"/>

  <!-- the average -->
  <circle cx="960" cy="540" r="150" fill="url(#avgGlow)"/>
  <circle cx="960" cy="540" r="26" fill="#8a8a8a"/>
  <circle cx="960" cy="540" r="26" fill="none" stroke="#b3b3b3" stroke-width="2" opacity="0.5"/>
  <text x="960" y="618" text-anchor="middle" fill="#666666" font-size="30" font-weight="500" letter-spacing="6">THE AVERAGE</text>

  <!-- vector: creativity (up) -->
  <line x1="960" y1="500" x2="960" y2="180" stroke="#ff6b35" stroke-width="7" marker-end="url(#arrow)"/>
  <text x="960" y="120" text-anchor="middle" fill="#ff6b35" font-size="42" font-weight="700" letter-spacing="8">CREATIVITY</text>

  <!-- vector: distinctiveness (down-left) -->
  <line x1="925" y1="560" x2="480" y2="817" stroke="#ff6b35" stroke-width="7" marker-end="url(#arrow)"/>
  <text x="420" y="905" text-anchor="middle" fill="#ff6b35" font-size="42" font-weight="700" letter-spacing="8">DISTINCTIVENESS</text>

  <!-- vector: precision (down-right) -->
  <line x1="995" y1="560" x2="1440" y2="817" stroke="#ff6b35" stroke-width="7" marker-end="url(#arrow)"/>
  <text x="1500" y="905" text-anchor="middle" fill="#ff6b35" font-size="42" font-weight="700" letter-spacing="8">PRECISION</text>
</svg>
</div>
</body>
</html>
