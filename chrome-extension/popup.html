<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 350px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #ffffff;
      margin: 0;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .logo {
      font-size: 18px;
      font-weight: bold;
      color: #ff6b35;
      margin-bottom: 5px;
    }
    
    .subtitle {
      font-size: 12px;
      color: #999;
    }
    
    .section {
      margin-bottom: 20px;
      padding: 15px;
      background: #1a1a1a;
      border-radius: 8px;
      border: 1px solid #333;
    }
    
    .section-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #ff6b35;
    }
    
    .button {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      background: #ff6b35;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.3s;
    }
    
    .button:hover {
      background: #ff8555;
    }
    
    .button:disabled {
      background: #555;
      cursor: not-allowed;
      opacity: 0.6;
    }
    
    .button.secondary {
      background: #333;
      color: #ccc;
    }
    
    .button.secondary:hover {
      background: #444;
    }
    
    .status {
      font-size: 12px;
      padding: 8px;
      border-radius: 4px;
      margin: 5px 0;
      text-align: center;
    }
    
    .status.success {
      background: #0d5016;
      color: #4caf50;
      border: 1px solid #2e7d2e;
    }
    
    .status.error {
      background: #5d1a1a;
      color: #f44336;
      border: 1px solid #d32f2f;
    }
    
    .status.info {
      background: #1a3a5d;
      color: #2196f3;
      border: 1px solid #1976d2;
    }
    
    .file-info {
      font-size: 11px;
      color: #999;
      margin-top: 5px;
    }
    
    .page-detection {
      font-size: 12px;
      color: #999;
      margin-bottom: 15px;
      padding: 8px;
      background: #2a2a2a;
      border-radius: 4px;
    }
    
    .counter {
      font-size: 11px;
      color: #ff6b35;
      font-weight: 600;
    }
    
    .version-info {
      font-size: 10px;
      color: #666;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">Bosser LinkedIn</div>
    <div class="subtitle">Publishing & Scraping Assistant</div>
    <div class="version-info" id="versionInfo">
      Plugin v2.0.6 | Code v?
    </div>
  </div>

  <div class="page-detection" id="pageDetection">
    🔍 Detecting LinkedIn page...
  </div>

  <!-- Publishing Section -->
  <div class="section">
    <div class="section-title">📤 Publishing</div>
    <button class="button" id="loadDraftButton" disabled>
      Load Draft from Bosser
    </button>
    <button class="button secondary" id="fillFormButton" disabled>
      Publish to LinkedIn
    </button>
    <div class="file-info" id="draftInfo">
      No draft loaded
    </div>
  </div>

  <!-- Scraping Section -->
  <div class="section">
    <div class="section-title">📥 Scraping</div>
    <button class="button" id="scrapeCurrentButton" disabled>
      Scrape Current Article
    </button>
    <button class="button secondary" id="scrapeAllButton" disabled>
      Scrape All Articles
    </button>
    <div class="counter" id="scrapedCounter">
      Scraped: 0 articles
    </div>
  </div>

  <!-- Data Management -->
  <div class="section">
    <div class="section-title">💾 Data</div>
    <button class="button secondary" id="syncButton">
      Sync to Bosser Project
    </button>
    <button class="button secondary" id="downloadButton">
      Download Scraped Data
    </button>
  </div>

  <!-- Status Messages -->
  <div id="statusContainer"></div>

  <!-- Debug Section -->
  <div class="section">
    <div class="section-title">🔧 Debug</div>
    <button class="button secondary" id="testConnectionButton">
      Test Content Script
    </button>
    <button class="button secondary" id="sendLogsButton">
      Send Logs to Claude
    </button>
  </div>

  <script src="logger.js"></script>
  <script src="text-utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
